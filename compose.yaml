services:
  backend:
    build:
      context: ./trivia-bridge
      dockerfile: Dockerfile
    environment:
      QUARKUS_HTTP_CORS_ORIGINS: ${QUARKUS_HTTP_CORS_ORIGINS:-http://localhost:5173}
      QUIZ_CACHE_TTL: ${QUIZ_CACHE_TTL:-1h}
      QUIZ_CACHE_MAXIMUM_SIZE: ${QUIZ_CACHE_MAXIMUM_SIZE:-10000}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./trivia-fe
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    depends_on:
      - backend
    ports:
      - "5173:80"
